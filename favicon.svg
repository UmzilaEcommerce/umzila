<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Umzila mark: a "u" that is also a route — it runs down, around and up
       into an arrow that arrives at the red destination dot (the same red
       dot that ends the umzila wordmark). Navy tile so it reads on light
       and dark browser tabs. -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.5" fill="#0d3a5c" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5"/>
  <path d="M19 15v19a13 13 0 0 0 26 0v-9" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <path d="M37.5 27.5 45 20l7.5 7.5" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="9.5" r="5.5" fill="#e53935"/>
</svg>
