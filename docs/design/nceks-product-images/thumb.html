<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Hanken+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=block">
<style>
/* 1200×1200 square. Everything that matters sits inside the central 840×840,
   so it survives the 3:4 homepage card crop and the 4:3 phone modal crop. */
:root{--bone:#F1ECDF;--ink:#161A17;--green:#267164;--forest:#192522;--olive:#26352F;--signal:#F29A1F;--signal-dk:#DB8410;--khaki:#B5A47F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:1200px;overflow:hidden;background:#000}
.frame{position:relative;width:1200px;height:1200px;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.mono{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.disp{font-family:"Archivo",sans-serif;font-weight:900;font-stretch:122%;letter-spacing:-.02em;line-height:.9}
.brand{position:absolute;left:50%;top:190px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;white-space:nowrap}
.brand img{width:92px;height:auto;filter:drop-shadow(0 6px 14px rgb(0 0 0 / .45))}
.brand span{font-size:24px}

/* ── RIDE (bookable) ── */
.ride .bg{filter:saturate(1.08) contrast(1.04)}
.ride .shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgb(10 16 13 / .6) 0%,rgb(10 16 13 / .15) 30%,rgb(10 16 13 / .55) 50%,rgb(10 16 13 / .9) 72%,rgb(10 16 13 / .94) 100%)}
.ride .copy{position:absolute;left:0;right:0;top:600px;text-align:center}
.ride .kicker{font-size:26px;color:var(--signal);text-shadow:0 2px 12px rgb(0 0 0 / .7)}
.ride .big{display:inline-block;white-space:nowrap;font-size:190px;margin-top:14px;text-shadow:0 10px 40px rgb(0 0 0 / .45)}
.ride .sub{font-family:"Archivo",sans-serif;font-weight:800;font-stretch:118%;font-size:50px;letter-spacing:.06em;text-transform:uppercase;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:16px;margin-top:40px;padding:22px 40px 22px 32px;border-radius:999px;background:var(--signal);color:#1d1306;font-family:"Archivo",sans-serif;font-weight:900;font-stretch:112%;font-size:34px;letter-spacing:.02em;text-transform:uppercase;box-shadow:0 18px 40px -14px rgb(0 0 0 / .6)}
.pill svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ride .foot{margin-top:22px;font-size:25px;font-weight:600;color:rgb(255 255 255 / .82)}

/* ── VOUCHER (gift) ── */
.voucher .bg{filter:blur(14px) saturate(.75) brightness(.55);transform:scale(1.12)}
.voucher .shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgb(38 113 100 / .35),rgb(25 37 34 / .9) 70%)}
.voucher .tag{position:absolute;left:50%;top:190px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:999px;background:rgb(255 255 255 / .12);border:2px solid rgb(255 255 255 / .28);font-size:26px;white-space:nowrap}
.voucher .tag svg{width:34px;height:34px;fill:none;stroke:var(--signal);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.card{position:absolute;left:50%;top:330px;width:780px;height:480px;margin-left:-390px;transform:rotate(-4deg);border-radius:34px;background:
  radial-gradient(circle at 88% 12%,rgb(242 154 31 / .22),transparent 46%),
  linear-gradient(145deg,#FBF7EE,#EFE6D2);color:var(--ink);box-shadow:0 50px 90px -30px rgb(0 0 0 / .75),0 0 0 2px rgb(255 255 255 / .5) inset;overflow:hidden}
.card .ribbon-v{position:absolute;top:0;bottom:0;right:150px;width:64px;background:linear-gradient(90deg,var(--signal-dk),var(--signal),var(--signal-dk))}
.card .ribbon-h{position:absolute;left:0;right:0;top:300px;height:56px;background:linear-gradient(180deg,var(--signal-dk),var(--signal),var(--signal-dk))}
.card .bow{position:absolute;right:118px;top:262px;width:130px;height:130px}
.card .inner{position:absolute;left:52px;top:46px;right:260px}
.card .lbl{font-size:22px;color:var(--green)}
.card .val{display:inline-block;white-space:nowrap;font-size:120px;margin-top:22px;color:var(--ink)}
.card .what{font-family:"Archivo",sans-serif;font-weight:800;font-stretch:115%;font-size:38px;letter-spacing:.04em;text-transform:uppercase;margin-top:10px;color:var(--olive)}
.card .from{position:absolute;left:52px;bottom:38px;display:flex;align-items:center;gap:12px;font-size:20px;color:#5a5f57}
.card .from img{width:44px;height:auto}
.card .notch{position:absolute;width:44px;height:44px;border-radius:50%;background:#1f2e2a;top:50%;margin-top:-22px}
.card .notch.l{left:-22px}.card .notch.r{right:-22px}
.voucher .foot{position:absolute;left:0;right:0;top:880px;text-align:center}
.voucher .foot b{display:block;font-family:"Archivo",sans-serif;font-weight:900;font-stretch:118%;font-size:46px;letter-spacing:.03em;text-transform:uppercase}
.voucher .foot span{display:block;margin-top:12px;font-size:26px;font-weight:600;color:rgb(255 255 255 / .8)}
</style></head>
<body>
<div class="frame" id="f"></div>
<script>
const q = new URLSearchParams(location.search);
const kind = q.get('k'), mins = +q.get('m'), img = q.get('img'), logo = q.get('logo');
const big = {30: '30 MIN', 60: '1 HOUR', 90: '1½ HOURS', 120: '2 HOURS'}[mins];
const cal = '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 14.5 2 2 4-4"/></svg>';
const gift = '<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/><path d="M12 8c-1.5-3.5-6-4-6-1.2C6 8.5 9 8 12 8zm0 0c1.5-3.5 6-4 6-1.2C18 8.5 15 8 12 8z"/></svg>';
const f = document.getElementById('f');
if (kind === 'ride') {
  f.className = 'frame ride';
  f.innerHTML = `<div class="bg" style="background-image:url('${img}')"></div><div class="shade"></div>
    <div class="brand"><img src="${logo}" alt=""><span class="mono">Nceks Quad Biking</span></div>
    <div class="copy">
      <div class="kicker mono">Guided ride · Inanda Dam</div>
      <div class="big disp">${big}</div>
      <div class="sub">Quad bike ride</div>
      <div class="pill">${cal}Book a time</div>
      <div class="foot">Price per quad · pick your day &amp; start time</div>
    </div>`;
} else {
  f.className = 'frame voucher';
  f.innerHTML = `<div class="bg" style="background-image:url('${img}')"></div><div class="shade"></div>
    <div class="tag mono">${gift}Gift voucher</div>
    <div class="card">
      <div class="ribbon-v"></div><div class="ribbon-h"></div>
      <svg class="bow" viewBox="0 0 120 120"><g fill="#F29A1F" stroke="#B9690C" stroke-width="3"><path d="M60 60C40 30 8 28 10 48c2 18 30 16 50 12z"/><path d="M60 60c20-30 52-32 50-12-2 18-30 16-50 12z"/><path d="M56 62 34 104l14-4 8 14 10-50z"/><path d="M64 62l22 42-14-4-8 14-10-50z"/></g><circle cx="60" cy="60" r="12" fill="#DB8410" stroke="#B9690C" stroke-width="3"/></svg>
      <div class="notch l"></div><div class="notch r"></div>
      <div class="inner">
        <div class="lbl mono">Gift voucher</div>
        <div class="val disp">${big}</div>
        <div class="what">Quad ride</div>
      </div>
      <div class="from"><img src="${logo}" alt=""><span>Nceks Quad Biking · Inanda Dam</span></div>
    </div>
    <div class="foot"><b>A ride to give</b><span>Emailed instantly · valid 3 years · they pick the day</span></div>`;
}
// Fit the headline inside the safe area (3:4 card crop keeps the middle 900px)
document.fonts.ready.then(() => {
  const fit = (el, max) => { if (!el) return; let fs = parseFloat(getComputedStyle(el).fontSize); while (el.getBoundingClientRect().width > max && fs > 40) { fs -= 2; el.style.fontSize = fs + 'px'; } };
  fit(document.querySelector('.ride .big'), 820);
  fit(document.querySelector('.card .val'), 450);
});
</script>
</body></html>
