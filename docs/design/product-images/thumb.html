<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Hanken+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=block">
<style>
/* Product image designs (rendered to WebP by render.js).
   ?k=ride|voucher|vel  &ar=sq (1200×1200, product image) | card (960×1200, Nceks "Pick your ride" card)
   Square: everything that matters sits in the central ~840px, so the 3:4
   homepage card crop and the 4:3 phone-modal crop keep it.
   The "tap … below" cue sits bottom-right because the real button is under
   the image on the right (homepage card "+"/Book pill, Nceks card Book). */
:root{--ink:#161A17;--green:#267164;--forest:#192522;--olive:#26352F;--signal:#F29A1F;--signal-dk:#DB8410;--vred:#E2261B;--vyel:#FFD23F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#000}
.frame{position:relative;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif;color:#fff}
.sq{width:1200px;height:1200px}.card{width:960px;height:1200px}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.mono{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.disp{font-family:"Archivo",sans-serif;font-weight:900;font-stretch:122%;letter-spacing:-.02em;line-height:.9}
.brand{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;white-space:nowrap}
.brand img{width:92px;height:auto;filter:drop-shadow(0 6px 14px rgb(0 0 0 / .45))}
.brand span{font-size:24px;text-shadow:0 2px 12px rgb(0 0 0 / .6)}

/* tap-below cue */
.cue{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px}
.cue .lbl{padding:14px 24px;border-radius:999px;background:rgb(10 16 13 / .78);border:2px solid rgb(255 255 255 / .35);font-family:"Archivo",sans-serif;font-weight:800;font-stretch:110%;font-size:30px;letter-spacing:.01em;white-space:nowrap;box-shadow:0 14px 30px -12px rgb(0 0 0 / .7)}
.cue .lbl b{color:var(--signal)}
.cue svg{width:110px;height:140px;filter:drop-shadow(0 8px 14px rgb(0 0 0 / .55))}

/* ── RIDE ── */
.ride .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgb(10 16 13 / .6) 0%,rgb(10 16 13 / .15) 30%,rgb(10 16 13 / .55) 50%,rgb(10 16 13 / .9) 72%,rgb(10 16 13 / .94) 100%)}
.ride .copy{position:absolute;left:0;right:0;text-align:center}
.ride .kicker{font-size:26px;color:var(--signal);text-shadow:0 2px 12px rgb(0 0 0 / .7)}
.ride .big{display:inline-block;white-space:nowrap;font-size:190px;margin-top:14px;text-shadow:0 10px 40px rgb(0 0 0 / .45)}
.ride .sub{font-family:"Archivo",sans-serif;font-weight:800;font-stretch:118%;font-size:50px;letter-spacing:.06em;text-transform:uppercase;margin-top:16px}
.ride .foot{margin-top:18px;font-size:26px;font-weight:600;color:rgb(255 255 255 / .85)}

/* ── VOUCHER ── */
.voucher .bg{filter:blur(14px) saturate(.75) brightness(.55);transform:scale(1.12)}
.voucher .shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgb(38 113 100 / .35),rgb(25 37 34 / .9) 70%)}
.voucher .tag{position:absolute;left:50%;top:190px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:999px;background:rgb(255 255 255 / .12);border:2px solid rgb(255 255 255 / .28);font-size:26px;white-space:nowrap}
.voucher .tag svg{width:34px;height:34px;fill:none;stroke:var(--signal);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.gc{position:absolute;left:50%;top:310px;width:780px;height:470px;margin-left:-390px;transform:rotate(-4deg);border-radius:34px;background:radial-gradient(circle at 88% 12%,rgb(242 154 31 / .22),transparent 46%),linear-gradient(145deg,#FBF7EE,#EFE6D2);color:var(--ink);box-shadow:0 50px 90px -30px rgb(0 0 0 / .75),0 0 0 2px rgb(255 255 255 / .5) inset;overflow:hidden}
.gc .rv{position:absolute;top:0;bottom:0;right:150px;width:64px;background:linear-gradient(90deg,var(--signal-dk),var(--signal),var(--signal-dk))}
.gc .rh{position:absolute;left:0;right:0;top:296px;height:56px;background:linear-gradient(180deg,var(--signal-dk),var(--signal),var(--signal-dk))}
.gc .bow{position:absolute;right:118px;top:258px;width:130px;height:130px}
.gc .inner{position:absolute;left:52px;top:46px;right:260px}
.gc .l{font-size:22px;color:var(--green)}
.gc .val{display:inline-block;white-space:nowrap;font-size:120px;margin-top:22px}
.gc .what{font-family:"Archivo",sans-serif;font-weight:800;font-stretch:115%;font-size:38px;letter-spacing:.04em;text-transform:uppercase;margin-top:10px;color:var(--olive)}
.gc .from{position:absolute;left:52px;bottom:34px;display:flex;align-items:center;gap:12px;font-size:20px;color:#5a5f57}
.gc .from img{width:44px;height:auto}
.gc .notch{position:absolute;width:44px;height:44px;border-radius:50%;background:#1f2e2a;top:50%;margin-top:-22px}
.gc .notch.l2{left:-22px}.gc .notch.r2{right:-22px}
.voucher .foot{position:absolute;left:0;right:0;top:838px;text-align:center;font-size:27px;font-weight:600;color:rgb(255 255 255 / .85)}

/* ── VELAPHI PLATE ── */
.vel .bg{background-position:center 60%}
.vel .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgb(18 6 4 / .7) 0%,rgb(18 6 4 / .1) 26%,rgb(18 6 4 / 0) 46%,rgb(18 6 4 / .78) 70%,rgb(18 6 4 / .94) 100%)}
.vel .brand{top:170px}
.vel .brand img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#fff;border:4px solid #fff}
.vel .copy{position:absolute;left:0;right:0;top:700px;text-align:center}
.vel .t1{font-family:"Archivo",sans-serif;font-weight:900;font-stretch:118%;font-size:64px;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 4px 20px rgb(0 0 0 / .6)}
.vel .t2{display:inline-block;white-space:nowrap;text-transform:uppercase;font-size:178px;color:var(--vyel);margin-top:6px;text-shadow:0 10px 36px rgb(0 0 0 / .55)}
.vel .chips{display:flex;justify-content:center;gap:14px;margin-top:22px}
.vel .chip{padding:12px 24px;border-radius:999px;background:var(--vred);font-family:"Archivo",sans-serif;font-weight:800;font-stretch:110%;font-size:28px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 12px 26px -10px rgb(0 0 0 / .7)}
.vel .chip.alt{background:rgb(255 255 255 / .14);border:2px solid rgb(255 255 255 / .4)}
</style></head>
<body>
<div class="frame" id="f"></div>
<script>
const q = new URLSearchParams(location.search);
const kind = q.get('k'), ar = q.get('ar') || 'sq', img = q.get('img'), logo = q.get('logo');
const mins = +q.get('m');
const big = {30: '30 MIN', 60: '1 HOUR', 90: '1½ HOURS', 120: '2 HOURS'}[mins];
const f = document.getElementById('f');
const W = ar === 'card' ? 960 : 1200;
document.documentElement.style.cssText = `width:${W}px;height:1200px`;
const arrow = '<svg viewBox="0 0 110 140"><path d="M55 6 C 62 40, 66 70, 56 104" fill="none" stroke="#F29A1F" stroke-width="12" stroke-linecap="round"/><path d="M26 82 L56 120 L86 82" fill="none" stroke="#F29A1F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const cue = (verb, pos) => `<div class="cue" style="${pos}"><div class="lbl">Tap <b>${verb}</b> below</div>${arrow}</div>`;
const gift = '<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/><path d="M12 8c-1.5-3.5-6-4-6-1.2C6 8.5 9 8 12 8zm0 0c1.5-3.5 6-4 6-1.2C18 8.5 15 8 12 8z"/></svg>';

if (kind === 'ride') {
  const card = ar === 'card';
  f.className = `frame ride ${card ? 'card' : 'sq'}`;
  f.innerHTML = `<div class="bg" style="background-image:url('${img}')"></div><div class="shade"></div>
    <div class="brand" style="top:${card ? 250 : 190}px"><img src="${logo}" alt=""><span class="mono">Nceks Quad Biking</span></div>
    <div class="copy" style="top:${card ? 470 : 400}px">
      <div class="kicker mono">Guided ride · Inanda Dam</div>
      <div class="big disp">${big}</div>
      <div class="sub">Quad bike ride</div>
      <div class="foot">Price per quad · pick your day &amp; time</div>
    </div>
    ${cue('Book', card ? 'right:46px;top:900px' : 'right:170px;top:840px')}`;
} else if (kind === 'voucher') {
  f.className = 'frame voucher sq';
  f.innerHTML = `<div class="bg" style="background-image:url('${img}')"></div><div class="shade"></div>
    <div class="tag mono">${gift}Gift voucher</div>
    <div class="gc"><div class="rv"></div><div class="rh"></div>
      <svg class="bow" viewBox="0 0 120 120"><g fill="#F29A1F" stroke="#B9690C" stroke-width="3"><path d="M60 60C40 30 8 28 10 48c2 18 30 16 50 12z"/><path d="M60 60c20-30 52-32 50-12-2 18-30 16-50 12z"/><path d="M56 62 34 104l14-4 8 14 10-50z"/><path d="M64 62l22 42-14-4-8 14-10-50z"/></g><circle cx="60" cy="60" r="12" fill="#DB8410" stroke="#B9690C" stroke-width="3"/></svg>
      <div class="notch l2"></div><div class="notch r2"></div>
      <div class="inner"><div class="l mono">Gift voucher</div><div class="val disp">${big}</div><div class="what">Quad ride</div></div>
      <div class="from"><img src="${logo}" alt=""><span>Nceks Quad Biking · Inanda Dam</span></div>
    </div>
    <div class="foot">Emailed instantly · valid 3 years · they pick the day</div>
    ${cue('Buy gift', 'right:170px;top:900px')}`;
} else if (kind === 'vel') {
  f.className = 'frame vel sq';
  f.innerHTML = `<div class="bg" style="background-image:url('${img}')"></div><div class="shade"></div>
    <div class="brand"><img src="${logo}" alt=""><span class="mono">Velaphi Shisanyama</span></div>
    <div class="copy">
      <div class="t1">${q.get('t1') || 'Beef &amp; wors'}</div>
      <div class="t2 disp">${q.get('t2')}</div>
      <div class="chips">${(q.get('chips') || 'Free sides').split('|').map((c, i) => `<span class="chip${i ? ' alt' : ''}">${c}</span>`).join('')}</div>
    </div>`;
}
document.fonts.ready.then(() => {
  const fit = (el, max) => { if (!el) return; let fs = parseFloat(getComputedStyle(el).fontSize); while (el.getBoundingClientRect().width > max && fs > 40) { fs -= 2; el.style.fontSize = fs + 'px'; } };
  fit(document.querySelector('.ride .big'), ar === 'card' ? 820 : 820);
  fit(document.querySelector('.gc .val'), 450);
  fit(document.querySelector('.vel .t2'), 820);
});
</script>
</body></html>
