[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAILS"

# Back-in-stock emails for "Notify me" sign-ups (stock_alerts).
[functions."send-stock-alerts"]
  schedule = "*/15 * * * *"

# Post-delivery 1–5 star rating email, ~10 min after delivery (once per delivery).
[functions."send-rating-requests"]
  schedule = "*/5 * * * *"

# Site images: browsers reuse them for a day and keep showing the cached copy
# while re-checking in the background for a week (instant repeat visits). When
# replacing one of these files with a different picture, give it a new name.
[[headers]]
  for = "/hero-velaphi-shisanyama.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/hero-nceks-quad-biking.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/umzila.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/ncekeniquads/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Clean store URLs: umzila.store/<slug> -> shop.html (URL stays clean).
# Real files (cart.html, style.css, …) are always served first, so this only
# catches single-segment paths that aren't files; shop.html resolves the
# slug against sellers.slug and handles anything that isn't a store.
[[redirects]]
  from = "/:slug"
  to = "/shop.html"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200