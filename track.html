<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="umzila.webp" type="image/webp">
<title>Track Your Delivery — Umzila</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f2f3f7;
    --accent: #0a2f66;
    --accent-light: #e8edf8;
    --muted: #6b7280;
    --border: #e9eaf0;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #dc2626;
  }
  html, body { min-height: 100%; background: var(--bg); color: #111; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header.t-header { position: sticky; top: 0; z-index: 20; background: var(--accent); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  header.t-header a { color: #fff; text-decoration: none; font-size: 20px; line-height: 1; }
  header.t-header .t-title { font-weight: 700; font-size: 16px; }
  .t-body { max-width: 560px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }
  .t-card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(11,13,20,0.05); }
  .t-status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; }
  .t-status-preparing { background: var(--accent-light); color: var(--accent); }
  .t-status-onway { background: #fff7ed; color: #c2410c; }
  .t-status-arriving { background: #fef3c7; color: #92400e; }
  .t-status-delivered { background: #ecfdf5; color: #15803d; }
  .t-status-problem { background: #fef2f2; color: var(--danger); }
  #trackMap { width: 100%; height: 280px; border-radius: 12px; margin-top: 12px; background: #e5e7eb; }
  .t-map-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .t-steps { list-style: none; margin: 14px 0 0; padding: 0; }
  .t-steps li { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; color: var(--muted); }
  .t-steps li.done { color: #111; font-weight: 600; }
  .t-steps li.current { color: var(--accent); font-weight: 700; }
  .t-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .t-steps li.done .t-dot, .t-steps li.current .t-dot { background: var(--accent); }
  .t-pin-box { display: flex; align-items: center; justify-content: space-between; background: var(--accent-light); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  .t-pin-box .t-pin-label { font-size: 12px; color: var(--muted); }
  .t-pin-box .t-pin-value { font-size: 20px; font-weight: 800; letter-spacing: 3px; color: var(--accent); }
  .t-empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .t-empty .icon { font-size: 40px; margin-bottom: 10px; }
  .t-back-link { display: inline-block; margin-top: 14px; color: var(--accent); font-weight: 600; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>

<header class="t-header">
  <a href="profile.html" aria-label="Back">&#8592;</a>
  <div class="t-title">Track Your Delivery</div>
</header>

<div class="t-body">
  <div id="trackContent">
    <div class="t-card"><div class="t-empty"><div class="icon">⏳</div><p>Loading your delivery…</p></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  // ── bootstrap (same pattern as profile.html / logistics.html: no shared
  // JS module in this codebase, each page carries its own copy) ──────────
  const cfgRes = await fetch('/.netlify/functions/get-client-config').catch(() => null);
  const cfg = cfgRes ? await cfgRes.json().catch(() => ({})) : {};
  const url = cfg.supabaseUrl || cfg.SUPABASE_URL || cfg.url || '';
  const key = cfg.supabaseAnonKey || cfg.SUPABASE_ANON_KEY || cfg.anonKey || '';
  const content = document.getElementById('trackContent');
  if (!url || !key) {
    content.innerHTML = emptyCard('⚠️', 'Could not connect. Please refresh the page.');
    return;
  }
  const sb = supabase.createClient(url, key);

  const { data: { session } } = await sb.auth.getSession();
  if (!session || !session.user) {
    window.location.href = 'index.html';
    return;
  }

  const orderId = new URLSearchParams(window.location.search).get('order');
  if (!orderId) {
    content.innerHTML = emptyCard('📦', 'No order specified.') + backLink();
    return;
  }

  function esc(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function emptyCard(icon, msg) {
    return `<div class="t-card"><div class="t-empty"><div class="icon">${icon}</div><p>${esc(msg)}</p></div></div>`;
  }
  function backLink() { return '<a class="t-back-link" href="profile.html">&larr; Back to my orders</a>'; }

  // ── friendly status mapping — mirrors the same collapsing-raw-enum-into-
  // customer-language approach profile.html's statusBadge() already uses
  // for order status, applied here to the finer-grained delivery_status ──
  const STAGE_PREPARING = ['PENDING', 'READY_FOR_DISPATCH', 'OFFERED', 'REASSIGNING'];
  const STAGE_PICKUP = ['ASSIGNED', 'DRIVER_AT_PICKUP', 'PARTIALLY_PICKED_UP', 'PICKED_UP'];
  const STAGE_ONWAY = ['IN_ROUTE', 'NEXT_STOP'];
  const STAGE_ARRIVING = ['ARRIVING', 'PIN_REQUIRED'];
  const STAGE_DONE = ['DELIVERED'];
  const STAGE_PROBLEM = ['CANCELLED', 'FAILED', 'RETURNED'];

  function statusMeta(status) {
    if (STAGE_PROBLEM.includes(status)) return { cls: 't-status-problem', label: status === 'CANCELLED' ? 'Cancelled' : status === 'RETURNED' ? 'Returned' : 'Delivery issue', stepIdx: -1 };
    if (STAGE_DONE.includes(status)) return { cls: 't-status-delivered', label: 'Delivered ✓', stepIdx: 4 };
    if (STAGE_ARRIVING.includes(status)) return { cls: 't-status-arriving', label: 'Rider has arrived', stepIdx: 3 };
    if (STAGE_ONWAY.includes(status)) return { cls: 't-status-onway', label: 'On the way to you', stepIdx: 2 };
    if (STAGE_PICKUP.includes(status)) return { cls: 't-status-preparing', label: 'Rider collecting your order', stepIdx: 1 };
    return { cls: 't-status-preparing', label: 'Preparing your order', stepIdx: 0 };
  }

  const STEP_LABELS = ['Order received', 'Rider assigned & collecting', 'On the way', 'Arriving', 'Delivered'];

  function renderSteps(stepIdx) {
    if (stepIdx < 0) return ''; // problem state — steps aren't meaningful
    return '<ul class="t-steps">' + STEP_LABELS.map((label, i) => {
      const cls = i < stepIdx ? 'done' : (i === stepIdx ? 'current' : '');
      return `<li class="${cls}"><span class="t-dot"></span>${esc(label)}</li>`;
    }).join('') + '</ul>';
  }

  // ── map (Leaflet + OSM tiles — free, keyless, no Google browser key;
  // static display only, no in-page turn-by-turn routing/navigation) ─────
  let map = null, destMarker = null, driverMarker = null;
  function ensureMap(destLat, destLon) {
    if (map) return;
    const mapEl = document.createElement('div');
    mapEl.id = 'trackMap';
    document.getElementById('mapMount').appendChild(mapEl);
    map = L.map('trackMap', { zoomControl: true, attributionControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    map.setView([destLat, destLon], 14);
    destMarker = L.circleMarker([destLat, destLon], { radius: 8, color: '#0a2f66', fillColor: '#0a2f66', fillOpacity: 1 })
      .addTo(map).bindPopup('Delivery address');
  }

  function updateDriverMarker(lat, lon, isStale, staleLabel) {
    if (!map) return;
    const color = isStale ? '#9ca3af' : '#22c55e';
    if (driverMarker) {
      driverMarker.setLatLng([lat, lon]);
      driverMarker.setStyle({ color, fillColor: color });
    } else {
      driverMarker = L.circleMarker([lat, lon], { radius: 9, color, fillColor: color, fillOpacity: 0.9, weight: 3 }).addTo(map);
    }
    driverMarker.bindPopup(isStale ? `Your rider — last seen ${staleLabel}` : 'Your rider — live');
    // Fit both points in view without disrupting a user's manual pan/zoom
    // on every poll — only auto-fit the first time the driver marker appears.
  }

  const STALENESS_SECONDS = 90; // matches dispatch.js's DRIVER_STALENESS_SECONDS

  function formatStale(seconds) {
    const mins = Math.floor(seconds / 60);
    if (mins < 1) return 'moments ago';
    if (mins === 1) return '1 minute ago';
    if (mins < 60) return `${mins} minutes ago`;
    const hrs = Math.floor(mins / 60);
    return hrs === 1 ? '1 hour ago' : `${hrs} hours ago`;
  }

  let pollTimer = null;
  let firstDriverFit = true;

  async function loadTracking() {
    const { data, error } = await sb.rpc('get_delivery_tracking', { p_order_id: orderId });
    const row = Array.isArray(data) ? data[0] : data;

    if (error || !row || !row.delivery_id) {
      content.innerHTML = emptyCard('📦', 'No live tracking available for this order yet.') + backLink();
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      return;
    }

    const meta = statusMeta(row.status);
    const isProblem = meta.stepIdx < 0;
    const isDone = row.status === 'DELIVERED';

    // First render sets up the static shell once; subsequent polls only
    // patch the live bits (status pill, steps, map marker) rather than
    // rebuilding the whole card and losing map pan/zoom state.
    if (!document.getElementById('statusPill')) {
      content.innerHTML = `
        <div class="t-card">
          <span id="statusPill" class="t-status-pill ${meta.cls}">${esc(meta.label)}</span>
          <div id="stepsWrap">${renderSteps(meta.stepIdx)}</div>
          ${row.delivery_pin ? `<div class="t-pin-box"><span class="t-pin-label">Give this PIN to your rider on arrival</span><span class="t-pin-value">${esc(row.delivery_pin)}</span></div>` : ''}
        </div>
        <div class="t-card">
          <div id="mapMount"></div>
          <div id="mapNote" class="t-map-note"></div>
        </div>
        ${backLink()}
      `;
    } else {
      const pill = document.getElementById('statusPill');
      pill.className = `t-status-pill ${meta.cls}`;
      pill.textContent = meta.label;
      document.getElementById('stepsWrap').innerHTML = renderSteps(meta.stepIdx);
    }

    if (Number.isFinite(row.destination_lat) && Number.isFinite(row.destination_lon)) {
      ensureMap(row.destination_lat, row.destination_lon);
    }

    const mapNote = document.getElementById('mapNote');
    if (Number.isFinite(row.driver_lat) && Number.isFinite(row.driver_lon)) {
      const ageSec = row.driver_location_at ? (Date.now() - new Date(row.driver_location_at).getTime()) / 1000 : Infinity;
      const isStale = ageSec > STALENESS_SECONDS;
      const staleLabel = formatStale(ageSec);
      updateDriverMarker(row.driver_lat, row.driver_lon, isStale, staleLabel);
      if (mapNote) mapNote.textContent = isStale ? `Rider location last seen ${staleLabel} — may not be current.` : 'Showing your rider\'s live position.';
      if (firstDriverFit && map) {
        map.fitBounds(L.latLngBounds([[row.driver_lat, row.driver_lon], [row.destination_lat, row.destination_lon]]), { padding: [30, 30] });
        firstDriverFit = false;
      }
    } else if (mapNote) {
      mapNote.textContent = isProblem ? '' : 'A rider hasn\'t been assigned to your delivery yet.';
    }

    // No in-page turn-by-turn navigation is intentional here (per plan) --
    // this is a passive status view, not a navigation tool.

    if ((isDone || isProblem) && pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  await loadTracking();
  pollTimer = setInterval(loadTracking, 20000);
})();
</script>
</body>
</html>
