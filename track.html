<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/umzila.webp" type="image/webp">
<title>Track Your Delivery — Umzila</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f2f3f7;
    --accent: #0a2f66;
    --accent-light: #e8edf8;
    --pink: #e0284f;
    --muted: #6b7280;
    --border: #e9eaf0;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #dc2626;
  }
  html, body { min-height: 100%; background: var(--bg); color: #111; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header.t-header { position: sticky; top: 0; z-index: 20; background: var(--accent); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  header.t-header a { color: #fff; text-decoration: none; font-size: 20px; line-height: 1; }
  header.t-header .t-title { font-weight: 700; font-size: 16px; }
  .t-body { max-width: 560px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }
  .t-card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(11,13,20,0.05); }
  .t-status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; }
  .t-status-preparing { background: var(--accent-light); color: var(--accent); }
  .t-status-onway { background: #fff7ed; color: #c2410c; }
  .t-status-arriving { background: #fef3c7; color: #92400e; }
  .t-status-delivered { background: #ecfdf5; color: #15803d; }
  .t-status-problem { background: #fef2f2; color: var(--danger); }
  #trackMap { width: 100%; height: 280px; border-radius: 12px; margin-top: 12px; background: #e5e7eb; }
  .t-map-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .t-empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .t-empty .icon { font-size: 40px; margin-bottom: 10px; }
  .t-back-link { display: inline-block; margin-top: 14px; color: var(--accent); font-weight: 600; text-decoration: none; font-size: 14px; }

  /* ── hero: stage scene + headline ── */
  .t-hero { padding: 0; overflow: hidden; }
  .t-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
  .t-live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .t-live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: tPulse 1.6s ease-in-out infinite; }
  .t-live.final .t-live-dot { background: #cbd5e1; animation: none; }
  .t-scene { position: relative; overflow: hidden; margin: 10px 12px 0; border-radius: 12px; background: linear-gradient(180deg, #f5f8ff 0%, #eaf0fb 100%); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .t-scene svg { display: block; width: 100%; height: auto; }
  .t-scene.swap { animation: tSceneIn .45s ease both; }
  .t-bubble { position: absolute; left: 50%; top: 10px; transform: translate(-50%, 6px); background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }
  .t-bubble.show { opacity: 1; transform: translate(-50%, 0); }
  .t-scene-hint { position: absolute; right: 10px; bottom: 8px; font-size: 10px; color: #94a3b8; font-weight: 600; }
  .t-headline { padding: 14px 16px 16px; }
  .t-headline h1 { margin: 0; font-size: 20px; color: var(--accent); letter-spacing: -.2px; }
  .t-headline p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .t-distance { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: var(--accent-light); color: var(--accent); font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 999px; }
  .t-distance[hidden] { display: none; }

  /* ── interactive step timeline ── */
  .t-track { position: relative; display: flex; justify-content: space-between; margin: 4px 0 0; }
  .t-rail, .t-rail-fill { position: absolute; top: 17px; left: 18px; height: 3px; border-radius: 3px; }
  .t-rail { right: 18px; background: var(--border); }
  .t-rail-fill { background: linear-gradient(90deg, var(--accent), #3b6fc4, var(--accent)); background-size: 200% 100%; animation: tFlow 2.4s linear infinite; transition: width .6s ease; }
  .t-step { position: relative; z-index: 1; flex: 0 0 auto; width: 56px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--muted); -webkit-tap-highlight-color: transparent; }
  .t-step-ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid var(--border); transition: background .3s, border-color .3s, transform .2s; }
  .t-step-ico svg { width: 17px; height: 17px; }
  .t-step-lbl { font-size: 10.5px; font-weight: 600; text-align: center; line-height: 1.25; }
  .t-step.done .t-step-ico { background: var(--accent); border-color: var(--accent); color: #fff; }
  .t-step.done { color: #111; }
  .t-step.current .t-step-ico { background: #fff; border-color: var(--accent); color: var(--accent); animation: tRing 1.8s ease-out infinite; }
  .t-step.current { color: var(--accent); }
  .t-step.selected .t-step-ico { transform: scale(1.12); }
  .t-step.selected .t-step-lbl { text-decoration: underline; text-underline-offset: 3px; }
  .t-step-info { margin-top: 14px; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; font-size: 13px; color: #374151; line-height: 1.5; }
  .t-step-info strong { color: var(--accent); }
  .t-step-info.swap { animation: tSceneIn .3s ease both; }

  /* ── PIN tiles + show-to-rider mode ── */
  .t-pin { margin-top: 0; }
  .t-pin-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .t-pin-label { font-size: 13px; color: var(--muted); }
  .t-pin-tiles { display: flex; gap: 8px; margin-top: 10px; }
  .t-pin-tiles span { flex: 1; max-width: 58px; aspect-ratio: 4/5; display: grid; place-items: center; font-size: 26px; font-weight: 800; color: var(--accent); background: var(--accent-light); border-radius: 10px; border: 2px solid transparent; }
  .t-pin.hot .t-pin-tiles span { border-color: var(--pink); animation: tTile 1.6s ease-in-out infinite; }
  .t-pin.hot .t-pin-tiles span:nth-child(2) { animation-delay: .12s; }
  .t-pin.hot .t-pin-tiles span:nth-child(3) { animation-delay: .24s; }
  .t-pin.hot .t-pin-tiles span:nth-child(4) { animation-delay: .36s; }
  .t-pin-show { border: 0; background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .t-pin-full { position: fixed; inset: 0; z-index: 50; background: var(--accent); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; cursor: pointer; }
  .t-pin-full.open { display: flex; animation: tSceneIn .25s ease both; }
  .t-pin-full .big { display: flex; gap: 12px; }
  .t-pin-full .big span { width: 64px; height: 84px; display: grid; place-items: center; font-size: 48px; font-weight: 800; background: rgba(255,255,255,.12); border-radius: 14px; }
  .t-pin-full small { opacity: .7; font-size: 13px; }

  @keyframes tPulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes tRing { 0% { box-shadow: 0 0 0 0 rgba(10,47,102,.35); } 100% { box-shadow: 0 0 0 10px rgba(10,47,102,0); } }
  @keyframes tFlow { from { background-position: 200% 0; } to { background-position: 0 0; } }
  @keyframes tSceneIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes tTile { 0%,100% { transform: none; } 50% { transform: translateY(-3px); } }

  /* Motion is decoration only — every state is also spelled out in text. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <small>Show this to your rider</small>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  // ── bootstrap (same pattern as profile.html / logistics.html: no shared
  // JS module in this codebase, each page carries its own copy) ──────────
  const cfgRes = await fetch('/.netlify/functions/get-client-config').catch(() => null);
  const cfg = cfgRes ? await cfgRes.json().catch(() => ({})) : {};
  const url = cfg.supabaseUrl || cfg.SUPABASE_URL || cfg.url || '';
  const key = cfg.supabaseAnonKey || cfg.SUPABASE_ANON_KEY || cfg.anonKey || '';
  const content = document.getElementById('trackContent');
  if (!url || !key) {
    content.innerHTML = emptyCard('⚠️', 'Could not connect. Please refresh the page.');
    return;
  }
  const sb = supabase.createClient(url, key);

  const { data: { session } } = await sb.auth.getSession();
  // The private tracking link (?order=…&t=<token>, from the payment-success
  // page and delivery emails) works without an account — guests, or buyers
  // who signed up after ordering. Signed-in buyers can also track their own
  // orders from their profile without a token.
  // Tracking links this device has opened/received (ss_track_links, also
  // written by checkout-success.html and read by the homepage widget and
  // profile) — so a link without ?t= still works on the device that ordered.
  const qsOrder = new URLSearchParams(window.location.search).get('order');
  let savedLinks = [];
  try { savedLinks = JSON.parse(localStorage.getItem('ss_track_links') || '[]') || []; } catch (e) {}
  const savedHit = Array.isArray(savedLinks) ? savedLinks.find(l => l && l.o === qsOrder) : null;
  const trackToken = new URLSearchParams(window.location.search).get('t') || (savedHit && savedHit.t) || null;
  if (qsOrder && trackToken) {
    try {
      const rest = (Array.isArray(savedLinks) ? savedLinks : []).filter(l => l && l.o !== qsOrder);
      localStorage.setItem('ss_track_links', JSON.stringify([{ o: qsOrder, t: trackToken, at: Date.now() }].concat(rest).slice(0, 5)));
    } catch (e) {}
    // Signed in with the same email as the order? The link proves they got
    // the order email, so link the order to the account (profile + homepage
    // widget then find it). Never by email alone. Best-effort.
    if (session && session.user) {
      sb.rpc('claim_order_with_token', { p_order_id: qsOrder, p_token: trackToken }).then(() => {}, () => {});
    }
  }
  if ((!session || !session.user) && !trackToken) {
    content.innerHTML = emptyCard('🔗', 'Open the “Track my delivery” link from your order confirmation email (or the page you saw after paying) to follow your order — no account needed. If you have an Umzila account, sign in and open your orders.')
      + '<a class="t-back-link" href="index.html">&larr; Back to Umzila</a>';
    return;
  }

  const orderId = new URLSearchParams(window.location.search).get('order');
  if (!orderId) {
    content.innerHTML = emptyCard('📦', 'No order specified.') + backLink();
    return;
  }

  function esc(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function emptyCard(icon, msg) {
    return `<div class="t-card"><div class="t-empty"><div class="icon">${icon}</div><p>${esc(msg)}</p></div></div>`;
  }
  function backLink() { return '<a class="t-back-link" href="profile.html">&larr; Back to my orders</a>'; }

  // Support entry point (plan §96) -- real WhatsApp/call number confirmed
  // by the founder 2026-09-17. Same number used in confirm-delivery-pin's
  // FAILED-delivery email (netlify/functions/lib/notify.js's UMZILA_WA).
  const UMZILA_WA = '27797662768';
  function supportCard() {
    const msg = encodeURIComponent('Hi Umzila! I need help with my delivery (order ' + orderId + ').');
    return `<div class="t-card" style="text-align:center">
      <div style="font-weight:700;font-size:14px;margin-bottom:8px">Need help?</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <a href="https://wa.me/${UMZILA_WA}?text=${msg}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:6px;background:#25d366;color:#fff;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px">💬 WhatsApp us</a>
        <a href="tel:+${UMZILA_WA}" style="display:inline-flex;align-items:center;gap:6px;background:var(--accent-light);color:var(--accent);padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px">📞 Call us</a>
      </div>
    </div>`;
  }

  // ── friendly status mapping — mirrors the same collapsing-raw-enum-into-
  // customer-language approach profile.html's statusBadge() already uses
  // for order status, applied here to the finer-grained delivery_status ──
  const STAGE_PREPARING = ['PENDING', 'READY_FOR_DISPATCH', 'OFFERED', 'REASSIGNING'];
  const STAGE_PICKUP = ['ASSIGNED', 'DRIVER_AT_PICKUP', 'PARTIALLY_PICKED_UP', 'PICKED_UP'];
  const STAGE_ONWAY = ['IN_ROUTE', 'NEXT_STOP'];
  const STAGE_ARRIVING = ['ARRIVING', 'PIN_REQUIRED'];
  const STAGE_DONE = ['DELIVERED'];
  const STAGE_PROBLEM = ['CANCELLED', 'FAILED', 'RETURNED'];

  function statusMeta(status) {
    if (STAGE_PROBLEM.includes(status)) return { cls: 't-status-problem', label: status === 'CANCELLED' ? 'Cancelled' : status === 'RETURNED' ? 'Returned' : 'Delivery issue', stepIdx: -1 };
    if (STAGE_DONE.includes(status)) return { cls: 't-status-delivered', label: 'Delivered ✓', stepIdx: 4 };
    if (STAGE_ARRIVING.includes(status)) return { cls: 't-status-arriving', label: status === 'PIN_REQUIRED' ? 'Rider has arrived' : 'Rider arriving', stepIdx: 3 };
    if (STAGE_ONWAY.includes(status)) return { cls: 't-status-onway', label: 'On the way to you', stepIdx: 2 };
    if (STAGE_PICKUP.includes(status)) return { cls: 't-status-preparing', label: 'Rider collecting your order', stepIdx: 1 };
    return { cls: 't-status-preparing', label: 'Preparing your order', stepIdx: 0 };
  }

  // ── per-stage copy + looping scene (delivery-network-spec.md §52/§93:
  // small, gentle, state-driven SVG animation; text always carries the
  // meaning so reduced-motion users lose nothing — §54) ──────────────────
  const STEPS = [
    { label: 'Order received', title: 'Preparing your order', sub: 'The store is packing everything up for you.',
      info: '<strong>The store has your order.</strong> They\'re getting it packed and ready for a rider to collect.',
      done: 'The store received and packed your order.', soon: '',
      taps: ['Packing with care 📦', 'Almost ready…', 'Double-checking everything ✔️'],
      icon: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>' },
    { label: 'Collecting', title: 'Rider collecting your order', sub: 'Your rider is heading to the store.',
      info: '<strong>A rider has your delivery.</strong> They\'re on their way to the store to pick up your order.',
      done: 'Your rider collected your order from the store.', soon: 'A rider will collect your order from the store.',
      taps: ['Beep beep! 🚗', 'Vroom vroom 💨', 'On it!'],
      icon: '<path d="M3 10l2-6h14l2 6"/><path d="M4 10v10h16V10"/><path d="M10 20v-5h4v5"/>' },
    { label: 'On the way', title: 'On the way to you', sub: 'Your order has left the store.',
      info: '<strong>Your order is out of the store</strong> and heading your way. Follow your rider live on the map below.',
      done: 'Your rider made the trip over to you.', soon: 'Your rider heads your way, and you can follow along live on the map.',
      taps: ['Zooming over 💨', 'Coming in hot 🔥', 'Not long now!'],
      icon: '<path d="M3 17h2a2 2 0 1 0 4 0h6a2 2 0 1 0 4 0h2v-5l-3-5h-5v10"/><path d="M14 7H3v10"/>' },
    { label: 'Arriving', title: 'Your rider is arriving', sub: 'Have your 4-digit PIN ready.',
      info: '<strong>Your rider is at your address.</strong> Show them your 4-digit PIN to receive your order.',
      done: 'Your rider arrived and checked your PIN.', soon: 'Your rider pulls up and you show them your 4-digit PIN.',
      taps: ['Knock knock 🚪', 'PIN ready? 🔢', 'Here!'],
      icon: '<path d="M12 21c-5-6-8-9.5-8-12.5a8 8 0 0 1 16 0c0 3-3 6.5-8 12.5z"/><circle cx="12" cy="8.5" r="2.5"/>' },
    { label: 'Delivered', title: 'Delivered!', sub: 'Enjoy — thanks for shopping local.',
      info: '<strong>Handed over.</strong> Enjoy your order, and let us know how the delivery went below.',
      done: '', soon: 'Your order is in your hands. 🎉',
      taps: ['Enjoy! 🎉', 'Thanks for shopping local 💛', 'Woohoo!'],
      icon: '<path d="M5 12.5l4.5 4.5L19 7.5"/>' }
  ];

  // Each scene is a 320x140 SVG. data-freeze = the moment shown as a still
  // when the user prefers reduced motion (SMIL ignores CSS media queries).
  const ROUTE = 'M58 104C112 104 104 60 160 60S226 34 262 46';
  const SCENES = [
    // 0 — preparing: items drop into a bag beside the store, clock ticking
    `<svg viewBox="0 0 320 140" data-freeze="1.1" role="img" aria-label="The store packing your order">
      <path d="M24 118h272" stroke="#dbe4f5" stroke-width="4" stroke-linecap="round"/>
      <use href="#sym-store" x="104" y="40" width="84" height="78"/>
      <g transform="translate(66 74)">
        <circle r="15" fill="#fff" stroke="#0a2f66" stroke-width="2.5"/>
        <path d="M0 0v-9" stroke="#0a2f66" stroke-width="2.5" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></path>
        <path d="M0 0h6" stroke="#e0284f" stroke-width="2.5" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></path>
      </g>
      <rect x="226" y="30" width="12" height="12" rx="2" fill="#e0284f">

    `<svg viewBox="0 0 320 140" data-freeze="1.2" role="img" aria-label="Your order delivered to your door">

        `<rect x="${x}" y="-10" width="6" height="9" rx="1.5" fill="${c}">
          <animate attributeName="y" values="-10;120" dur="3s" begin="${b}s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="rotate" values="0 ${x} 60;200 ${x} 60" dur="3s" begin="${b}s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0" keyTimes="0;.8;1" dur="3s" begin="${b}s" repeatCount="indefinite"/>
        </rect>`).join('')}
    </svg>`
  ];
  const PROBLEM_SCENE = `<svg viewBox="0 0 320 140" role="img" aria-label="There is a problem with this delivery">
      <circle cx="160" cy="70" r="34" fill="#fde8e8"/><circle cx="160" cy="70" r="22" fill="#dc2626"/>
      <path d="M160 58v14" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="160" cy="80" r="2.6" fill="#fff"/>
    </svg>`;

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function renderScene(stepIdx) {
    const wrap = document.getElementById('scene');
    if (!wrap) return;
    wrap.innerHTML = (stepIdx < 0 ? PROBLEM_SCENE : SCENES[stepIdx]) + '<div class="t-bubble" id="sceneBubble"></div>' + (stepIdx < 0 ? '' : '<div class="t-scene-hint">tap me</div>');
    wrap.classList.remove('swap'); void wrap.offsetWidth; wrap.classList.add('swap');
    const svg = wrap.querySelector('svg');
    if (reduceMotion && svg && svg.pauseAnimations) {
      try { svg.setCurrentTime(parseFloat(svg.dataset.freeze || '0')); svg.pauseAnimations(); } catch (e) { /* static is fine */ }
    }
  }

  function renderTimeline(stepIdx) {
    if (stepIdx < 0) return '';
    const pct = (stepIdx / (STEPS.length - 1)) * 100;
    return `<div class="t-track">
        <div class="t-rail"></div>
        <div class="t-rail-fill" style="width:calc((100% - 36px) * ${pct / 100})"></div>
        ${STEPS.map((s, i) => `<button type="button" class="t-step ${i < stepIdx ? 'done' : (i === stepIdx ? 'current' : '')}" data-step="${i}" aria-label="${esc(s.label)}">
          <span class="t-step-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg></span>
          <span class="t-step-lbl">${esc(s.label)}</span>
        </button>`).join('')}
      </div>
      <div class="t-step-info" id="stepInfo" aria-live="polite"></div>`;
  }

  let selectedStep = null;
  function selectStep(i, stepIdx) {
    selectedStep = i;
    document.querySelectorAll('.t-step').forEach(b => b.classList.toggle('selected', Number(b.dataset.step) === i));
    const info = document.getElementById('stepInfo');
    if (!info) return;
    const st = STEPS[i];
    info.innerHTML = i < stepIdx ? `<strong>✓ Done.</strong> ${esc(st.done)}` : i > stepIdx ? `<strong>Coming up:</strong> ${esc(st.soon)}` : st.info;
    info.classList.remove('swap'); void info.offsetWidth; info.classList.add('swap');
  }

  function wireTimeline(stepIdx) {
    document.querySelectorAll('.t-step').forEach(b => b.addEventListener('click', () => selectStep(Number(b.dataset.step), stepIdx)));
    selectStep(selectedStep === null ? stepIdx : selectedStep, stepIdx);
  }

  // Tap the scene for a little reaction — pure delight, never blocks anything.
  let bubbleTimer = null, tapCount = 0;
  function sceneTap(stepIdx) {
    if (stepIdx < 0) return;
    const bubble = document.getElementById('sceneBubble');
    if (!bubble) return;
    const taps = STEPS[stepIdx].taps;
    bubble.textContent = taps[tapCount++ % taps.length];
    const hint = document.querySelector('.t-scene-hint');
    if (hint) hint.remove();
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 1600);
  }

  // ── PIN tiles + full-screen "show to rider" ─────────────────────────────
  function pinCard(pin) {
    const digits = String(pin).split('');
    return `<div class="t-card t-pin" id="pinCard">
      <div class="t-pin-head">
        <span class="t-pin-label">Give this PIN to your rider on arrival</span>
        <button type="button" class="t-pin-show" id="pinShowBtn">Show rider ⤢</button>
      </div>
      <div class="t-pin-tiles">${digits.map(d => `<span>${esc(d)}</span>`).join('')}</div>
    </div>`;
  }
  const pinFull = document.getElementById('pinFull');
  pinFull.addEventListener('click', () => pinFull.classList.remove('open'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') pinFull.classList.remove('open'); });
  function openPinFull(pin) {
    document.getElementById('pinFullDigits').innerHTML = String(pin).split('').map(d => `<span>${esc(d)}</span>`).join('');
    pinFull.classList.add('open');
  }

  // ── live ticker + straight-line rider distance ──────────────────────────
  let lastUpdated = 0, tickTimer = null;
  function tick() {
    const el = document.getElementById('liveText');
    if (!el || !lastUpdated) return;
    const s = Math.round((Date.now() - lastUpdated) / 1000);
    el.textContent = s < 5 ? 'Live · updated just now' : `Live · updated ${s < 60 ? s + 's' : Math.floor(s / 60) + 'm'} ago`;
  }
  function haversineKm(aLat, aLon, bLat, bLon) {
    const R = 6371, toRad = d => d * Math.PI / 180;
    const dLat = toRad(bLat - aLat), dLon = toRad(bLon - aLon);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function formatDistance(km) {
    if (km < 1) return `${Math.max(50, Math.round(km * 1000 / 50) * 50)} m`;
    return `${km.toFixed(1)} km`;
  }

  // ── map (Leaflet + OSM tiles — free, keyless, no Google browser key;
  // static display only, no in-page turn-by-turn routing/navigation) ─────
  let map = null, destMarker = null, driverMarker = null;
  function ensureMap(destLat, destLon) {
    if (map) return;
    const mapEl = document.createElement('div');
    mapEl.id = 'trackMap';
    document.getElementById('mapMount').appendChild(mapEl);
    map = L.map('trackMap', { zoomControl: true, attributionControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    map.setView([destLat, destLon], 14);
    destMarker = L.circleMarker([destLat, destLon], { radius: 8, color: '#0a2f66', fillColor: '#0a2f66', fillOpacity: 1 })
      .addTo(map).bindPopup('Delivery address');
  }

  function updateDriverMarker(lat, lon, isStale, staleLabel) {
    if (!map) return;
    const color = isStale ? '#9ca3af' : '#22c55e';
    if (driverMarker) {
      driverMarker.setLatLng([lat, lon]);
      driverMarker.setStyle({ color, fillColor: color });
    } else {
      driverMarker = L.circleMarker([lat, lon], { radius: 9, color, fillColor: color, fillOpacity: 0.9, weight: 3 }).addTo(map);
    }
    driverMarker.bindPopup(isStale ? `Your rider — last seen ${staleLabel}` : 'Your rider — live');
    // Fit both points in view without disrupting a user's manual pan/zoom
    // on every poll — only auto-fit the first time the driver marker appears.
  }

  const STALENESS_SECONDS = 90; // matches dispatch.js's DRIVER_STALENESS_SECONDS

  function formatStale(seconds) {
    const mins = Math.floor(seconds / 60);
    if (mins < 1) return 'moments ago';
    if (mins === 1) return '1 minute ago';
    if (mins < 60) return `${mins} minutes ago`;
    const hrs = Math.floor(mins / 60);
    return hrs === 1 ? '1 hour ago' : `${hrs} hours ago`;
  }

  let pollTimer = null;
  let firstDriverFit = true;
  let shownStep = null;

  async function loadTracking() {
    const { data, error } = await sb.rpc('get_delivery_tracking', { p_order_id: orderId, p_token: trackToken });
    const row = Array.isArray(data) ? data[0] : data;

    if (error || !row || !row.delivery_id) {
      content.innerHTML = emptyCard('📦', trackToken
        ? 'We couldn’t find live tracking for this link. Check you opened the full link from your email, or contact support.'
        : 'This order was placed without signing in, so it isn’t linked to your account yet. Open the “Track my delivery” link in your order confirmation email once — it links the order to your account (same email) and you can track it from here after that.') + backLink();
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      return;
    }

    const meta = statusMeta(row.status);
    const isProblem = meta.stepIdx < 0;
    const isDone = row.status === 'DELIVERED';
    const stage = isProblem ? null : STEPS[meta.stepIdx];
    const atDoor = row.status === 'PIN_REQUIRED';
    const title = isProblem ? meta.label : atDoor ? 'Your rider is here!' : stage.title;
    const sub = isProblem ? 'Something\'s not right with this delivery — our team can help below.' : atDoor ? 'Show them your 4-digit PIN to get your order.' : stage.sub;

    // First render sets up the static shell once; subsequent polls only
    // patch the live bits (status pill, scene, steps, map marker) rather
    // than rebuilding the whole card and losing map pan/zoom state.
    if (!document.getElementById('statusPill')) {
      content.innerHTML = `
        <div class="t-card t-hero">
          <div class="t-hero-top">
            <span id="statusPill" class="t-status-pill ${meta.cls}">${esc(meta.label)}</span>
            <span class="t-live" id="liveWrap"><span class="t-live-dot"></span><span id="liveText">Live</span></span>
          </div>
          <div class="t-scene" id="scene" title="Tap me"></div>
          <div class="t-headline">
            <h1 id="heroTitle">${esc(title)}</h1>
            <p id="heroSub">${esc(sub)}</p>
            <span class="t-distance" id="distanceChip" hidden></span>
          </div>
        </div>
        ${row.delivery_pin ? pinCard(row.delivery_pin) : ''}
        <div class="t-card" id="stepsCard"${isProblem ? ' hidden' : ''}><div id="stepsWrap"></div></div>
        <div class="t-card">
          <div id="mapMount"></div>
          <div id="mapNote" class="t-map-note"></div>
        </div>
        <div id="feedbackMount"></div>
        ${supportCard()}
        ${backLink()}
      `;
      document.getElementById('scene').addEventListener('click', () => sceneTap(shownStep));
      if (row.delivery_pin) document.getElementById('pinShowBtn').addEventListener('click', () => openPinFull(row.delivery_pin));
      tickTimer = setInterval(tick, 1000);
    } else {
      const pill = document.getElementById('statusPill');
      pill.className = `t-status-pill ${meta.cls}`;
      pill.textContent = meta.label;
      document.getElementById('heroTitle').textContent = title;
      document.getElementById('heroSub').textContent = sub;
      document.getElementById('stepsCard').hidden = isProblem;
    }

    // Only swap the scene/timeline when the stage actually changes, so the
    // looping animation isn't restarted on every 20s poll.
    if (shownStep !== meta.stepIdx) {
      if (shownStep !== null) selectedStep = null; // follow the new stage
      shownStep = meta.stepIdx;
      renderScene(meta.stepIdx);
      document.getElementById('stepsWrap').innerHTML = renderTimeline(meta.stepIdx);
      if (!isProblem) wireTimeline(meta.stepIdx);
    }

    const pinCardEl = document.getElementById('pinCard');
    if (pinCardEl) {
      pinCardEl.classList.toggle('hot', STAGE_ARRIVING.includes(row.status));
      pinCardEl.hidden = isDone || isProblem; // nothing left to hand over
    }

    lastUpdated = Date.now();
    tick();

    if (Number.isFinite(row.destination_lat) && Number.isFinite(row.destination_lon)) {
      ensureMap(row.destination_lat, row.destination_lon);
    }

    const mapNote = document.getElementById('mapNote');
    const chip = document.getElementById('distanceChip');
    chip.hidden = true;
    if (Number.isFinite(row.driver_lat) && Number.isFinite(row.driver_lon)) {
      const ageSec = row.driver_location_at ? (Date.now() - new Date(row.driver_location_at).getTime()) / 1000 : Infinity;
      const isStale = ageSec > STALENESS_SECONDS;
      const staleLabel = formatStale(ageSec);
      updateDriverMarker(row.driver_lat, row.driver_lon, isStale, staleLabel);
      if (mapNote) mapNote.textContent = isStale ? `Rider location last seen ${staleLabel} — may not be current.` : 'Showing your rider\'s live position.';
      if (firstDriverFit && map) {
        map.fitBounds(L.latLngBounds([[row.driver_lat, row.driver_lon], [row.destination_lat, row.destination_lon]]), { padding: [30, 30] });
        firstDriverFit = false;
      }
      // Straight-line distance, labelled "about" — no ETA is claimed since
      // the tracking RPC doesn't provide one.
      if (!isDone && !isProblem && !atDoor && Number.isFinite(row.destination_lat) && Number.isFinite(row.destination_lon)) {
        const km = haversineKm(row.driver_lat, row.driver_lon, row.destination_lat, row.destination_lon);
        chip.textContent = `📍 About ${formatDistance(km)} away${isStale ? ' (last seen ' + staleLabel + ')' : ''}`;
        chip.hidden = false;
      }
    } else if (mapNote) {
      // No live coordinates doesn't mean no rider yet -- Fix D (delivery-network-spec.md)
      // deliberately hides position until the rider is actually heading to the
      // customer (STAGE_ONWAY+), even once one is ASSIGNED and collecting the order.
      mapNote.textContent = isProblem ? '' :
        STAGE_PICKUP.includes(row.status) ? 'Your rider is on the way to collect your order — live tracking starts once they head your way.' :
        'A rider hasn\'t been assigned to your delivery yet.';
    }

    // No in-page turn-by-turn navigation is intentional here (per plan) --
    // this is a passive status view, not a navigation tool.

    if ((isDone || isProblem) && pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
    if (isDone || isProblem) {
      if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
      const live = document.getElementById('liveWrap');
      live.classList.add('final');
      document.getElementById('liveText').textContent = isDone ? 'Complete' : 'Stopped';
    }

    if (isDone) await renderFeedbackPrompt(row.delivery_id);
  }

  // ── Stage 13b: post-delivery compliment/complaint prompt (plan §97) ────
  const FEEDBACK_CATEGORIES = ["My order was late", "My order was missing something", "I couldn't meet the driver", "Another delivery problem"];
  let feedbackLoaded = false;

  async function renderFeedbackPrompt(deliveryId) {
    const mount = document.getElementById('feedbackMount');
    if (!mount || feedbackLoaded) return;
    feedbackLoaded = true;

    const { data: existing } = await sb.from('delivery_feedback').select('id').eq('delivery_id', deliveryId).maybeSingle();
    if (existing) {
      mount.innerHTML = `<div class="t-card" style="text-align:center;color:var(--muted);font-size:13px">Thanks for your feedback on this delivery! 🙏</div>`;
      return;
    }

    mount.innerHTML = `<div class="t-card" id="feedbackPromptCard">
      <div style="font-weight:700;font-size:14px;margin-bottom:10px">How was your Umzila delivery?</div>
      <div style="display:flex;gap:10px">
        <button class="fb-choice-btn" id="fbLovedBtn" style="flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;cursor:pointer">♡ Loved it</button>
        <button class="fb-choice-btn" id="fbProblemBtn" style="flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;cursor:pointer">Something went wrong</button>
      </div>
      <div id="feedbackFormWrap"></div>
    </div>`;

    document.getElementById('fbLovedBtn').addEventListener('click', () => showFeedbackForm(deliveryId, 'compliment'));
    document.getElementById('fbProblemBtn').addEventListener('click', () => showFeedbackForm(deliveryId, 'complaint'));
  }

  function showFeedbackForm(deliveryId, feedbackType) {
    const wrap = document.getElementById('feedbackFormWrap');
    if (!wrap) return;
    document.querySelectorAll('.fb-choice-btn').forEach(b => b.style.display = 'none');

    const categoryHtml = feedbackType === 'complaint'
      ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0" id="fbCategoryChoices">${FEEDBACK_CATEGORIES.map(c => `<button type="button" class="fb-cat-btn" data-cat="${esc(c)}" style="padding:7px 12px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:12px;cursor:pointer">${esc(c)}</button>`).join('')}</div>`
      : '';

    wrap.innerHTML = `
      <div style="margin-top:10px;font-size:13px;color:var(--muted)">${feedbackType === 'compliment' ? 'Tell us what went well' : 'Tell us what happened'}</div>
      ${categoryHtml}
      <textarea id="fbMessage" rows="3" placeholder="${feedbackType === 'compliment' ? 'Great service, friendly rider...' : 'What went wrong?'}" style="width:100%;margin-top:8px;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;resize:vertical;box-sizing:border-box"></textarea>
      <div id="fbError" style="color:#c0392b;font-size:12px;margin-top:6px"></div>
      <button id="fbSubmitBtn" style="margin-top:10px;width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer">Submit</button>
    `;

    let selectedCategory = null;
    wrap.querySelectorAll('.fb-cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.fb-cat-btn').forEach(b => { b.style.background = '#fff'; b.style.color = '#111'; });
        btn.style.background = 'var(--accent)'; btn.style.color = '#fff';
        selectedCategory = btn.dataset.cat;
      });
    });

    document.getElementById('fbSubmitBtn').addEventListener('click', async () => {
      const btn = document.getElementById('fbSubmitBtn');
      const errEl = document.getElementById('fbError');
      const message = document.getElementById('fbMessage').value.trim();
      btn.disabled = true; btn.textContent = 'Submitting…';
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/submit-delivery-feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (session ? session.access_token : '') },
          body: JSON.stringify({ deliveryId, feedbackType, category: selectedCategory, message })
        });
        if (!res.ok) {
          const result = await res.json().catch(() => ({}));
          if (errEl) errEl.textContent = result.error || 'Could not submit feedback. Please try again.';
          btn.disabled = false; btn.textContent = 'Submit';
          return;
        }
        document.getElementById('feedbackPromptCard').innerHTML = `<div style="text-align:center;color:var(--muted);font-size:13px">Thanks for your feedback on this delivery! 🙏</div>`;
      } catch (e) {
        if (errEl) errEl.textContent = 'Could not submit feedback — check your connection and try again.';
        btn.disabled = false; btn.textContent = 'Submit';
      }
    });
  }

  await loadTracking();
  pollTimer = setInterval(loadTracking, 20000);
})();
</script>
</body>
</html>
